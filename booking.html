<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Inspired <b>Auto</b></a>
<nav aria-label="Main">
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="booking.html" aria-current="page">Booking</a>
<a href="about.html">About us</a>
<a href="contact.html">Contact</a>
</nav></div></header>
<main><div class="wrap">
<h1>Book a visit</h1><p class="lede">Send a request and I’ll confirm a time by phone or email.</p>
<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
<label>Name<input name="name" required autocomplete="name"></label>
<label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<div class="row">
<label>Year<select id="year" name="year" required><option value="">Select year</option></select></label>
<label>Make<select id="make" name="make" required disabled><option value="">Select make</option></select></label>
<label>Model<select id="model" name="model" required disabled><option value="">Select model</option></select></label>
</div>
<div class="row2">
<label>Engine<select id="engine" name="engine" required disabled><option value="">Select engine</option><option>4-cylinder</option><option>6-cylinder (V6 or inline-6)</option><option>8-cylinder (V8)</option><option>Diesel</option><option>Hybrid or electric</option><option>Not sure</option></select></label>
<label>Engine size or details (optional)<input name="engine_details" id="details" placeholder="e.g. 5.0L, 3.5L EcoBoost, 6.7L Cummins"></label>
</div>
<label>VIN (optional, gives the most accurate details)<input name="vin" id="vin" maxlength="17" autocapitalize="characters" autocomplete="off"></label>
<p class="note" id="vininfo" aria-live="polite"></p>
<label id="other-wrap" hidden>Not listed? Tell us the vehicle<input id="other" name="vehicle_other"></label>
<label>Service needed<select name="service"><option>Oil change</option><option>Brakes</option><option>Diagnostics</option><option>Suspension</option><option>Electrical</option><option>Inspection</option><option>Other</option></select></label>
<label>Preferred date<input name="date" type="date"></label>
<label>What’s going on?<textarea name="details" rows="4"></textarea></label>
<button class="btn" type="submit">Send request</button>
<p class="note">Requests are not confirmed until you hear back.</p></form>
<script>
const $=id=>document.getElementById(id),y=$('year'),m=$('make'),mo=$('model'),ow=$('other-wrap'),ot=$('other'),eng=$('engine'),det=$('details');
const makes=['Acura','Audi','BMW','Buick','Cadillac','Chevrolet','Chrysler','Dodge','Ford','GMC','Honda','Hyundai','Infiniti','Jeep','Kia','Lexus','Lincoln','Mazda','Mercedes-Benz','Mini','Mitsubishi','Nissan','Pontiac','Ram','Subaru','Toyota','Volkswagen','Volvo'];
const add=(s,v,t)=>s.add(new Option(t||v,v));
for(let i=new Date().getFullYear()+1;i>=1960;i--)add(y,i);
makes.concat('Other').forEach(v=>add(m,v));
function manual(){ow.hidden=false;ot.required=true}
function auto(){ow.hidden=true;ot.required=false;ot.value=''}
function sync(){eng.disabled=!mo.value}
function resetModel(){mo.length=1;mo.disabled=true;eng.value='';eng.disabled=true;auto()}
y.onchange=()=>{m.disabled=!y.value;m.value='';resetModel()};
m.onchange=async()=>{
  resetModel();if(!m.value||!y.value)return;
  if(m.value==='Other'){add(mo,'Other','Not listed');mo.value='Other';mo.disabled=false;manual();sync();return}
  mo.options[0].text='Loading…';
  try{
    const r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/'+encodeURIComponent(m.value)+'/modelyear/'+y.value+'?format=json');
    const names=[...new Set((await r.json()).Results.map(x=>x.Model_Name))].sort();
    if(!names.length)throw 0;
    names.forEach(n=>add(mo,n));add(mo,'Other','Other / not listed');
  }catch(e){add(mo,'Other','Not listed');mo.value='Other';manual()}
  mo.options[0].text='Select model';mo.disabled=false;sync();
};
mo.onchange=()=>{mo.value==='Other'?manual():auto();sync()};
$('vin').onchange=async()=>{
  const v=$('vin').value.trim(),n=$('vininfo');n.textContent='';if(v.length!==17)return;
  try{
    const d=(await (await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(v)+'?format=json')).json()).Results[0];
    const e=[d.DisplacementL&&(+d.DisplacementL).toFixed(1)+'L',d.EngineCylinders&&d.EngineCylinders+'-cyl',d.FuelTypePrimary].filter(Boolean).join(' ');
    n.textContent='VIN found: '+[d.ModelYear,d.Make,d.Model,e].filter(Boolean).join(' ');
    if(e&&!det.value)det.value=e;
  }catch(x){}
};
</script>
</div></main>
